databaseChangeLog:
  - changeSet:
      id: create-appointment
      author: codex
      changes:
        - createTable:
            tableName: appointment
            schemaName: listing_booking_service
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_appointment
                    nullable: false
              - column:
                  name: rental_request_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: customer_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: building_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: staff_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: appointment_date
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableSchemaName: listing_booking_service
            baseTableName: appointment
            baseColumnNames: rental_request_id
            constraintName: fk_appointment_rental_request
            referencedTableSchemaName: listing_booking_service
            referencedTableName: rental_request
            referencedColumnNames: id
        - createIndex:
            indexName: idx_appointment_rental_request_id
            schemaName: listing_booking_service
            tableName: appointment
            columns:
              - column:
                  name: rental_request_id
        - createIndex:
            indexName: idx_appointment_customer_id
            schemaName: listing_booking_service
            tableName: appointment
            columns:
              - column:
                  name: customer_id
        - createIndex:
            indexName: idx_appointment_building_id
            schemaName: listing_booking_service
            tableName: appointment
            columns:
              - column:
                  name: building_id
        - createIndex:
            indexName: idx_appointment_staff_id
            schemaName: listing_booking_service
            tableName: appointment
            columns:
              - column:
                  name: staff_id
        - createIndex:
            indexName: idx_appointment_status
            schemaName: listing_booking_service
            tableName: appointment
            columns:
              - column:
                  name: status
        - createIndex:
            indexName: idx_appointment_appointment_date
            schemaName: listing_booking_service
            tableName: appointment
            columns:
              - column:
                  name: appointment_date

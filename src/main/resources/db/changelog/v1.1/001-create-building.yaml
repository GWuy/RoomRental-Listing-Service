databaseChangeLog:
  - changeSet:
      id: v1.1-create-building
      author: codex
      changes:

        - createTable:
            schemaName: listing-booking-service
            tableName: building
            columns:

              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_building
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: address
                  type: VARCHAR(500)
                  constraints:
                    nullable: false

              - column:
                  name: ward_id
                  type: UUID

              - column:
                  name: district_id
                  type: UUID

              - column:
                  name: latitude
                  type: "DECIMAL(10,8)"

              - column:
                  name: longitude
                  type: "DECIMAL(11,8)"

              - column:
                  name: created_at
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: BIGINT
                  constraints:
                    nullable: false

        - sql:
            splitStatements: false
            sql: |
              ALTER TABLE "listing-booking-service".building
              ADD CONSTRAINT ck_building_latitude_range
              CHECK (
                latitude IS NULL
                OR latitude BETWEEN -90 AND 90
              );

              ALTER TABLE "listing-booking-service".building
              ADD CONSTRAINT ck_building_longitude_range
              CHECK (
                longitude IS NULL
                OR longitude BETWEEN -180 AND 180
              );

        - createIndex:
            schemaName: listing-booking-service
            tableName: building
            indexName: idx_building_ward_id
            columns:
              - column:
                  name: ward_id

        - createIndex:
            schemaName: listing-booking-service
            tableName: building
            indexName: idx_building_district_id
            columns:
              - column:
                  name: district_id

        - createIndex:
            schemaName: listing-booking-service
            tableName: building
            indexName: idx_building_latitude_longitude
            columns:
              - column:
                  name: latitude
              - column:
                  name: longitude

        - createIndex:
            schemaName: listing-booking-service
            tableName: building
            indexName: idx_building_created_at
            columns:
              - column:
                  name: created_at

        - sql:
            splitStatements: false
            sql: |
              DO $$
              BEGIN
                IF to_regclass('"listing-booking-service".room_listing') IS NOT NULL THEN

                  INSERT INTO "listing-booking-service".building (
                    id,
                    name,
                    address,
                    ward_id,
                    district_id,
                    latitude,
                    longitude,
                    created_at,
                    updated_at
                  )
                  SELECT DISTINCT ON (building_id)
                    building_id,
                    building_name,
                    address,
                    ward_id,
                    district_id,
                    latitude,
                    longitude,
                    created_at,
                    updated_at
                  FROM "listing-booking-service".room_listing
                  ORDER BY building_id, created_at;

                END IF;
              END
              $$;
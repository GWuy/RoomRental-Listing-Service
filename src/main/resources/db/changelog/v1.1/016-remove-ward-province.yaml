            schemaName: listing_booking_service
            tableName: building
            columnName: district_id
        - dropColumn:
            schemaName: listing_booking_service
            tableName: room_listing
            columnName: ward_id
        - dropColumn:
            schemaName: listing_booking_service
            tableName: room_listing
            columnName: district_id
        - dropTable:
            schemaName: listing_booking_service
            tableName: ward
        - dropTable:
            schemaName: listing_booking_service
            tableName: province
